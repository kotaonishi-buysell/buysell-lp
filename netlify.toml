# Netlify settings. Secrets (email key and addresses) are set in the Netlify dashboard, not here.
# See docs/forms/contact-form.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Turns the contact form on in every Netlify build (production and deploy previews): submissions go
  # to Netlify Forms (form "contact"). Local builds leave it unset, so the form stays in preview mode.
  # To use the email function in netlify/functions instead, remove this line and set
  # PUBLIC_CONTACT_ENDPOINT = "/api/contact" (see docs/forms/contact-form.md).
  PUBLIC_CONTACT_MODE = "netlify-forms"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# While /downsizing is the only live LP, the bare domain goes there.
[[redirects]]
  from = "/"
  to = "/downsizing"
  status = 302
  force = true
