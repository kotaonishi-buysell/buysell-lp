# Netlify settings. Secrets (email key and addresses) are set in the Netlify dashboard, not here.
# See docs/forms/contact-form.md.

[build]
  command = "npm run build && npm run check:public"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Turns the contact form on in every Netlify build (production and deploy previews). Local builds leave
  # these unset, so the form stays in preview mode.
  # The form posts to our own function (netlify/functions/contact.ts), which adds a row to the Google Sheet
  # (and emails the team when the email settings are set). If the function cannot take a request (the Google
  # settings are not in Netlify yet, or it is down), the browser sends it to Netlify Forms (form "contact"),
  # so no inquiry is lost. See docs/forms/contact-form.md.
  # To use only Netlify Forms, replace the two lines below with: PUBLIC_CONTACT_MODE = "netlify-forms"
  PUBLIC_CONTACT_ENDPOINT = "/api/contact"
  PUBLIC_CONTACT_FALLBACK = "netlify-forms"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The bare domain goes to Silver, the LP that is live. (/downsizing and /home-value are drafts: not published,
# see astro.config.mjs.)
[[redirects]]
  from = "/"
  to = "/silver"
  status = 302
  force = true
